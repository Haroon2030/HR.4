{# ترويسة موحّدة — تعريف راتب، التزام تحويل، وجميع النماذج الرسمية #}
<div class="letterhead">
    <div class="letterhead__row">
        <div class="letterhead__brand">
            <h1 class="letterhead__name-ar">{% firstof letterhead_name company.name "........................" %}</h1>
        </div>
        {% with cr=letterhead_company_cr|default:letterhead_cr|default:company.commercial_record %}
        <div class="letterhead__regs">
            {% if cr %}
            <p class="line">C.R <strong>{{ cr }}</strong></p>
            {% endif %}
        </div>
        {% endwith %}
    </div>
</div>
