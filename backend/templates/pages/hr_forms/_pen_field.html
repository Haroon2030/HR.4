{# حقل قابل للتعديل — يُعبّأ من value عند التوفّر (مثل تعريف الراتب) #}
<span class="blank hr-form-pen-field{% if extra_class %} {{ extra_class }}{% endif %}"
      data-input-type="text"
      data-label="{{ field_label|default:'' }}"
      data-placeholder="{{ placeholder|default_if_none:'................' }}"
      data-value="{{ value|default:''|escape }}"
      {% if ltr %}dir="ltr"{% endif %}>{{ value|default:''|escape }}</span>
